[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-traffic-law-rag"
version = "1.0.0"
description = "Grounded RAG system for Vietnamese traffic law QA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "gradio>=5.0",
    "openai>=1.50",
    "pydantic>=2.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "tqdm>=4.66",
    "FlagEmbedding>=1.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
evaluation = [
    "datasets>=3.0",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "ragas>=0.2",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
